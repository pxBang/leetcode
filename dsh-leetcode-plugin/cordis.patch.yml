# dsh-leetcode-plugin 的 bundle patch：把插件行插入 DSH Web profile 组合。
# 这里的 config 是插件配置的「默认层」；要覆盖请在你的 profile cordis.patch.yml 里
# 按 id: leetcode 重写整段 config（整段替换，不是逐字段合并；漏写的字段回落到 index.js 的默认值）。
- insert:
    - id: leetcode
      name: dsh-leetcode-plugin
      config:
        vault: /Users/panxingbang/Desktop/leetcode/leetcode
        leetcodeBase: https://leetcode.cn

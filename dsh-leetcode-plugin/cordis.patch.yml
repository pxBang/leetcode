# dsh-leetcode-plugin 的 bundle patch：把插件行插入 DSH Web profile 组合。
# vault 无需配置：插件从自身位置自动推导（同仓库的 leetcode/ 目录），找不到直接报错。
# 要覆盖 leetcodeBase 请在 profile 的 cordis.patch.yml 里按 id: leetcode 重写整段 config。
- insert:
    - id: leetcode
      name: dsh-leetcode-plugin
      config:
        leetcodeBase: https://leetcode.cn
